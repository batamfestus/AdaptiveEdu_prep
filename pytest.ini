[pytest]
# Only look for tests in the tests/ folder, in files named test_*.py.
#
# WHY: pytest's default also collects any file ending in "_test.py". Windows ignores
# capital letters in file names, so "pages/2_Take_a_Test.py" matched that pattern and
# pytest IMPORTED the Streamlit page as if it were a test, which ran the page and crashed.
# (Linux is case-sensitive, so the bug only appears on Windows.)
testpaths = tests
python_files = test_*.py